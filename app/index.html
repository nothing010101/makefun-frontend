<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leanboard — make.fun bounties</title>
<style>
:root{--bg:#0b0e13;--panel:#12161d;--panel2:#171c25;--line:#232a35;--text:#e6e9ee;--muted:#9aa4b2;--dim:#6b7686;--acc:#34d399;--amber:#f59e0b;--red:#f87171;--link:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;background:#0d1117ee;border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;color:var(--text);letter-spacing:.2px}
.brand b{color:var(--acc)}
nav a{color:var(--muted);margin-right:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
footer{max-width:980px;margin:0 auto;padding:0 16px 30px;color:var(--dim);font-size:13px}
h1{font-size:24px;margin:2px 0 4px}
h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar input[type=search]{flex:1;min-width:180px}
input,select,button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
ul.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.board li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
ul.board li:hover{border-color:#334155}
.row{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.row .t{font-weight:650;font-size:16px}
.row .pot{margin-left:auto;font-weight:750;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.meta b{color:var(--text);font-weight:600}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.open{color:var(--acc);border-color:#14532d}
.badge.soon{color:var(--amber);border-color:#713f12}
.badge.closed{color:var(--red);border-color:#7f1d1d}
.badge.fee{color:var(--link)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cell .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.cell .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.desc{white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--link)}
details .desc{margin-top:8px;max-height:320px;overflow:auto}
.vlist{border:1px solid var(--line);border-radius:10px;overflow:auto;height:480px;background:var(--panel);position:relative}
.vrow{display:flex;gap:10px;align-items:center;height:36px;padding:0 12px;border-bottom:1px solid #1a2029;font-size:14px}
.vrow .rk{width:44px;color:var(--muted);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.vrow .hd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .sc{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.vrow .ti{color:var(--muted);flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow.top3 .rk{color:var(--amber);font-weight:800}
.profile{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--acc);flex:none}
.loading{color:var(--muted);padding:30px 0}
.error{background:#2a1215;border:1px solid #7f1d1d;border-radius:10px;padding:12px 14px}
.error button{margin-top:8px}
@media (max-width:640px){
  body{font-size:14px}
  h1{font-size:20px}
  .row .pot{margin-left:0}
  .vrow .ti{display:none}
  .vlist{height:420px}
}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="#/"><b>Lean</b>board</a><nav aria-label="Main"><a href="#/" id="nav-board">Bounties</a></nav><span style="margin-left:auto;color:var(--dim);font-size:13px">make.fun, lean</span></div></header>
<main id="app" aria-live="polite"><p class="loading">Loading live bounties…</p></main>
<footer>Leanboard — a fast, read-only frontend for <a href="https://make.fun">make.fun</a>. Data: make.fun public API, cached and revalidated.</footer>
<script type="module">
window.__shotReady = false;
import('./app.js');
</script>
</body>
</html>
